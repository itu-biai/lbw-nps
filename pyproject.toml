[project]
name = "lbw-nps"
version = "1.0.0"
description = "Local band-weighted noise power spectrum loss for texture-preserving low-dose CT denoising"
readme = "README.md"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
extend-select = ["I", "N", "ANN", "D1"]
ignore = ["D105", "D107", "N812"]  # N812: `torch.nn.functional as F` is the PyTorch convention

[tool.ruff.lint.per-file-ignores]
# scripts/ and tests/ add src/ to sys.path before importing project modules
"scripts/*.py" = ["E402"]
"tests/*.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["config", "data", "evaluate", "isbi_data", "lbw_nps", "losses", "metrics",
                     "nps", "spectra", "train", "unet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
